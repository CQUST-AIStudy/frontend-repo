<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案 A · 时间轴页码流</title>
  <style>
    :root {
      --bg: #faf6f0;
      --card: #ffffff;
      --ink: #3d2b1f;
      --ink-light: #7c6b5d;
      --border: #e8dfd3;
      --amber: #f59e0b;
      --amber-soft: #fff7ed;
      --green: #22c55e;
      --green-soft: #f0fdf4;
      --red: #ef4444;
      --red-soft: #fef2f2;
      --blue: #3b82f6;
      --blue-soft: #eff6ff;
      --radius: 18px;
      --shadow: 0 4px 18px rgba(61, 43, 31, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    header {
      margin-bottom: 32px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-light);
      font-size: 14px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      font-weight: 800;
      margin: 0 0 8px;
    }
    .subtitle { color: var(--ink-light); font-size: 15px; }

    .score-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 1px solid #fde68a;
      border-radius: var(--radius);
      padding: 22px 28px;
      margin-bottom: 28px;
      box-shadow: var(--shadow);
    }
    .score-num { font-size: 42px; font-weight: 900; color: #b45309; }
    .score-label { font-size: 14px; color: #92400e; }

    .grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 28px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .panel h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }

    .dim-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      transition: transform .15s, box-shadow .15s;
    }
    .dim-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .dim-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .dim-name { font-weight: 700; }
    .dim-score { font-size: 20px; font-weight: 800; }
    .dim-comment {
      font-size: 13px;
      color: var(--ink-light);
      background: #faf7f2;
      border-radius: 10px;
      padding: 10px 12px;
    }

    /* Timeline */
    .timeline {
      position: relative;
      padding-left: 28px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 8px;
      top: 6px;
      bottom: 6px;
      width: 3px;
      background: linear-gradient(to bottom, var(--amber), rgba(245, 158, 11, .2));
      border-radius: 3px;
    }
    .page-group {
      position: relative;
      margin-bottom: 26px;
    }
    .page-group::before {
      content: '';
      position: absolute;
      left: -24px;
      top: 6px;
      width: 14px;
      height: 14px;
      background: var(--amber);
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(245, 158, 11, .3);
    }
    .page-label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      font-weight: 700;
      color: #92400e;
      margin-bottom: 10px;
    }
    .ev-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      transition: all .15s;
      cursor: default;
    }
    .ev-card:hover { border-color: var(--amber); box-shadow: 0 4px 14px rgba(245, 158, 11, .1); }
    .ev-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 10px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 700;
    }
    .tag-text { background: var(--blue-soft); color: var(--blue); }
    .tag-ocr { background: var(--green-soft); color: #15803d; }
    .tag-vlm { background: #f5f3ff; color: #7c3aed; }
    .tag-fail { background: var(--red-soft); color: var(--red); }
    .ev-content {
      font-size: 14px;
      color: var(--ink);
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .fail-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--red-soft);
      color: var(--red);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .fail-detail {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #faf7f2;
      font-size: 13px;
      color: var(--ink-light);
      display: none;
    }
    .fail-detail.open { display: block; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="back">← 返回</div>
      <h1>评阅：小胡</h1>
      <div class="subtitle">卷积网络基础 · 实验报告批改详情</div>
    </header>

    <div class="score-banner">
      <div>
        <div class="score-num">75</div>
        <div class="score-label">总分</div>
      </div>
      <div style="text-align:right; color:#92400e; font-size:14px;">
        <div>学生：小胡</div>
        <div>状态：已评分</div>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <h2>评分维度</h2>
        <div class="dim-card">
          <div class="dim-header">
            <span class="dim-name">代码正确性</span>
            <span class="dim-score">30 / 40</span>
          </div>
          <div class="dim-comment">报告提到了问题 A、B、C 的要求，但未展示实际代码运行结果或输出截图，无法确认程序是否通过核心测试点。</div>
        </div>
        <div class="dim-card">
          <div class="dim-header">
            <span class="dim-name">实验分析</span>
            <span class="dim-score">25 / 30</span>
          </div>
          <div class="dim-comment">实验收获部分说明理解了卷积和池化原理，但缺少对代码正确性的直接证据，比如输出形状是否与预期一致。</div>
        </div>
        <div class="dim-card">
          <div class="dim-header">
            <span class="dim-name">报告规范</span>
            <span class="dim-score">20 / 30</span>
          </div>
          <div class="dim-comment">代码的命名、注释和结构划分没有体现，影响了报告的可读性。建议附上关键代码片段和运行结果截图。</div>
        </div>
      </div>

      <div class="panel">
        <h2>证据材料（6）</h2>
        <div class="timeline" id="timeline"></div>
        <div class="legend">
          <span class="tag tag-text">文本</span>
          <span class="tag tag-ocr">OCR</span>
          <span class="tag tag-vlm">VLM</span>
          <span class="tag tag-fail">VLM 失败</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const evidence = [
      { id: 'ev-51-0cb16bd5-0002', kind: 'text', page: 2, content: '输出通道为2 的卷积\n垂直方向的卷积核用于实现边缘检测\n效果：' },
      { id: 'ev-51-0cb16bd5-0003', kind: 'vlm_failed', page: 2, content: 'Image evidence exists, but the multimodal model did not extract usable content.' },
      { id: 'ev-51-0cb16bd5-0007', kind: 'text', page: 3, content: '# 锐化\n#这个核是方向性锐化核，主要通过增强中心像素和上下邻域的差异，让图像的边缘和细节更明显；\n但它不是标准全方向锐化核，\n高斯模糊：' },
      { id: 'ev-51-0cb16bd5-0008', kind: 'vlm_failed', page: 3, content: 'Image evidence exists, but the multimodal model did not extract usable content.' },
      { id: 'ev-51-0cb16bd5-0010', kind: 'text', page: 4, content: '重新组合后的结果：' },
      { id: 'ev-51-0cb16bd5-0011', kind: 'vlm_failed', page: 4, content: 'Image evidence exists, but the multimodal model did not extract usable content.' }
    ];

    const kindMap = {
      text: { label: '文本', cls: 'tag-text' },
      ocr: { label: 'OCR', cls: 'tag-ocr' },
      vlm: { label: 'VLM', cls: 'tag-vlm' },
      vlm_failed: { label: 'VLM 失败', cls: 'tag-fail' }
    };

    const grouped = {};
    evidence.forEach(e => {
      if (!grouped[e.page]) grouped[e.page] = [];
      grouped[e.page].push(e);
    });

    const timeline = document.getElementById('timeline');
    Object.keys(grouped).sort((a, b) => a - b).forEach(page => {
      const group = document.createElement('div');
      group.className = 'page-group';
      group.innerHTML = `<div class="page-label">第 ${page} 页</div>`;
      grouped[page].forEach(e => {
        const meta = kindMap[e.kind];
        if (e.kind === 'vlm_failed') {
          const chip = document.createElement('div');
          chip.className = 'fail-chip';
          chip.innerHTML = `<span>⚠</span><span>第 ${e.page} 页图片 VLM 未识别</span>`;
          const detail = document.createElement('div');
          detail.className = 'fail-detail';
          detail.textContent = e.content;
          chip.onclick = () => detail.classList.toggle('open');
          group.appendChild(chip);
          group.appendChild(detail);
        } else {
          const card = document.createElement('div');
          card.className = 'ev-card';
          card.innerHTML = `
            <div class="ev-meta">
              <span class="tag ${meta.cls}">${meta.label}</span>
              <span style="font-size:12px;color:#a89a88;">页 ${e.page}</span>
            </div>
            <div class="ev-content">${e.content}</div>
          `;
          group.appendChild(card);
        }
      });
      timeline.appendChild(group);
    });
  </script>
</body>
</html>
