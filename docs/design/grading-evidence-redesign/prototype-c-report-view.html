<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案 C · 沉浸式报告对照</title>
  <style>
    :root {
      --bg: #faf6f0;
      --card: #ffffff;
      --ink: #3d2b1f;
      --ink-light: #7c6b5d;
      --border: #e8dfd3;
      --amber: #f59e0b;
      --amber-soft: #fff7ed;
      --green: #22c55e;
      --green-soft: #f0fdf4;
      --red: #ef4444;
      --red-soft: #fef2f2;
      --blue: #3b82f6;
      --blue-soft: #eff6ff;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --radius: 18px;
      --shadow: 0 4px 18px rgba(61, 43, 31, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }
    .wrap { max-width: 1300px; margin: 0 auto; padding: 40px 24px; }
    header { margin-bottom: 32px; }
    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-light); font-size: 14px; margin-bottom: 12px; cursor: pointer; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: 32px; font-weight: 800; margin: 0 0 8px; }
    .subtitle { color: var(--ink-light); font-size: 15px; }

    .score-banner {
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 1px solid #fde68a; border-radius: var(--radius);
      padding: 22px 28px; margin-bottom: 28px; box-shadow: var(--shadow);
    }
    .score-num { font-size: 42px; font-weight: 900; color: #b45309; }
    .score-label { font-size: 14px; color: #92400e; }

    .grid { display: grid; grid-template-columns: 260px 1fr; gap: 24px; align-items: start; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
    .panel h2 { font-family: Georgia, "Times New Roman", serif; font-size: 16px; font-weight: 700; margin: 0 0 16px; }

    .thumb {
      border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px;
      cursor: pointer; transition: all .15s; background: #fff;
    }
    .thumb:hover { border-color: var(--amber); }
    .thumb.active { border-color: var(--amber); background: var(--amber-soft); box-shadow: 0 0 0 2px rgba(245, 158, 11, .2); }
    .thumb-page { font-size: 12px; font-weight: 700; color: #92400e; margin-bottom: 6px; }
    .thumb-preview {
      height: 70px; background: #faf7f2; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--ink-light); text-align: center; padding: 6px;
      overflow: hidden;
    }
    .thumb-dots { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
    .dot { width: 7px; height: 7px; border-radius: 50%; }

    .viewer {
      background: #f4f0e9; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 32px; min-height: 520px;
    }
    .page-sheet {
      max-width: 560px; margin: 0 auto;
      background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(61,43,31,.1);
      padding: 36px; position: relative;
    }
    .page-sheet h3 { font-family: Georgia, "Times New Roman", serif; font-size: 18px; margin: 0 0 16px; }
    .page-sheet p { margin: 0 0 10px; color: var(--ink-light); font-size: 14px; }
    .highlight-box {
      border-left: 4px solid var(--amber); background: var(--amber-soft); padding: 10px 14px;
      border-radius: 0 10px 10px 0; margin: 12px 0; font-size: 13px;
    }

    .ev-float {
      position: absolute;
      right: -220px; top: 80px; width: 200px;
    }
    @media (max-width: 1100px) { .ev-float { position: static; width: auto; margin-top: 20px; } }

    .ev-card {
      background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 14px;
      margin-bottom: 10px; box-shadow: var(--shadow); transition: all .15s;
    }
    .ev-card:hover { transform: translateY(-2px); }
    .ev-card.active { border-color: var(--amber); box-shadow: 0 4px 16px rgba(245, 158, 11, .18); }
    .ev-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: 11px; font-size: 12px; font-weight: 700; }
    .tag-text { background: var(--blue-soft); color: var(--blue); }
    .tag-ocr { background: var(--green-soft); color: #15803d; }
    .tag-vlm { background: var(--purple-soft); color: var(--purple); }
    .tag-fail { background: var(--red-soft); color: var(--red); }
    .ev-content { font-size: 13px; white-space: pre-wrap; line-height: 1.6; }
    .page-ev-list { margin-top: 24px; }
    .section-title { font-family: Georgia, "Times New Roman", serif; font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="back">← 返回</div>
      <h1>评阅：小胡</h1>
      <div class="subtitle">卷积网络基础 · 实验报告批改详情</div>
    </header>

    <div class="score-banner">
      <div><div class="score-num">75</div><div class="score-label">总分</div></div>
      <div style="text-align:right;color:#92400e;font-size:14px;"><div>学生：小胡</div><div>状态：已评分</div></div>
    </div>

    <div class="grid">
      <div class="panel">
        <h2>报告页缩略图</h2>
        <div id="thumbs"></div>
      </div>

      <div class="viewer">
        <div class="page-sheet" id="viewer">
          <h3 id="pageTitle">第 1 页</h3>
          <p id="pageBody">学生报告封面与基本信息。</p>
          <div class="page-ev-list">
            <div class="section-title">该页证据</div>
            <div id="pageEvs"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const pages = {
      1: { title: '第 1 页 · 封面', body: 'xx 大学学生实验报告\n课程名称：深度学习\n实验项目名称：卷积网络基础\n开课学院及实验室：计算机学院（人工智能）', evidence: [] },
      2: { title: '第 2 页 · 卷积核设计', body: '本页包含卷积核设计与输出通道说明。', evidence: [
        { id: 'ev-51-0cb16bd5-0002', kind: 'text', content: '输出通道为2 的卷积\n垂直方向的卷积核用于实现边缘检测\n效果：' },
        { id: 'ev-51-0cb16bd5-0003', kind: 'vlm_failed', content: 'Image evidence exists, but the multimodal model did not extract usable content.' }
      ]},
      3: { title: '第 3 页 · 锐化与模糊', body: '本页包含锐化核与高斯模糊的说明。', evidence: [
        { id: 'ev-51-0cb16bd5-0007', kind: 'text', content: '# 锐化\n#这个核是方向性锐化核，主要通过增强中心像素和上下邻域的差异，让图像的边缘和细节更明显；\n但它不是标准全方向锐化核，\n高斯模糊：' },
        { id: 'ev-51-0cb16bd5-0008', kind: 'vlm_failed', content: 'Image evidence exists, but the multimodal model did not extract usable content.' }
      ]},
      4: { title: '第 4 页 · 组合结果', body: '本页展示重新组合后的结果。', evidence: [
        { id: 'ev-51-0cb16bd5-0010', kind: 'text', content: '重新组合后的结果：' },
        { id: 'ev-51-0cb16bd5-0011', kind: 'vlm_failed', content: 'Image evidence exists, but the multimodal model did not extract usable content.' }
      ]}
    };

    const kindMap = {
      text: { label: '文本', cls: 'tag-text', dot: '#3b82f6' },
      ocr: { label: 'OCR', cls: 'tag-ocr', dot: '#22c55e' },
      vlm: { label: 'VLM', cls: 'tag-vlm', dot: '#7c3aed' },
      vlm_failed: { label: 'VLM 失败', cls: 'tag-fail', dot: '#ef4444' }
    };

    let activePage = 2;

    function renderThumbs() {
      const container = document.getElementById('thumbs');
      container.innerHTML = '';
      Object.keys(pages).forEach(p => {
        const page = pages[p];
        const thumb = document.createElement('div');
        thumb.className = 'thumb' + (Number(p) === activePage ? ' active' : '');
        const dots = page.evidence.map(e => `<span class="dot" style="background:${kindMap[e.kind].dot}"></span>`).join('');
        thumb.innerHTML = `
          <div class="thumb-page">页 ${p}</div>
          <div class="thumb-preview">${page.title.replace('第 ' + p + ' 页 · ', '')}</div>
          <div class="thumb-dots">${dots || '<span style="font-size:11px;color:#a89a88;">无证据</span>'}</div>
        `;
        thumb.onclick = () => { activePage = Number(p); renderThumbs(); renderViewer(); };
        container.appendChild(thumb);
      });
    }

    function renderViewer() {
      const page = pages[activePage];
      document.getElementById('pageTitle').textContent = page.title;
      document.getElementById('pageBody').textContent = page.body;
      const evContainer = document.getElementById('pageEvs');
      evContainer.innerHTML = '';
      if (!page.evidence.length) {
        evContainer.innerHTML = '<div style="color:#a89a88;font-size:13px;">该页暂无 AI 提取的证据</div>';
        return;
      }
      page.evidence.forEach(e => {
        const meta = kindMap[e.kind];
        const card = document.createElement('div');
        card.className = 'ev-card';
        card.innerHTML = `
          <div class="ev-meta">
            <span class="tag ${meta.cls}">${meta.label}</span>
            <span style="font-size:12px;color:#a89a88;">${e.id}</span>
          </div>
          <div class="ev-content">${e.kind === 'vlm_failed' ? '⚠ ' + e.content : e.content}</div>
        `;
        evContainer.appendChild(card);
      });
    }

    renderThumbs();
    renderViewer();
  </script>
</body>
</html>
