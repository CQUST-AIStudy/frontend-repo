<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批改中心优化 - 紧凑高效版</title>
  <style>
    /* 假设：教师时间宝贵，需要高效率的操作流程 */
    /* 设计思路：单页表单，减少滚动，关键操作突出，进度可视化 */

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #1d1d1f;
      min-height: 100vh;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* 侧边栏 - 紧凑版 */
    .sidebar {
      width: 200px;
      background: #fff;
      border-right: 1px solid rgba(0,0,0,0.06);
      padding: 16px 0;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 0 16px 16px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      margin-bottom: 12px;
    }

    .sidebar-header h1 {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header h1 .icon {
      width: 28px;
      height: 28px;
      background: #eef5ff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #007aff;
      font-size: 14px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 13px;
      color: #6e6e73;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-item:hover {
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .nav-item.active {
      background: #eef5ff;
      color: #007aff;
      font-weight: 500;
    }

    .nav-item .arrow {
      margin-left: auto;
      font-size: 10px;
      color: #aeaeb2;
    }

    .nav-sub {
      padding-left: 36px;
      font-size: 12px;
    }

    .nav-sub.active {
      color: #007aff;
      font-weight: 500;
    }

    /* 主内容区 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* 顶部工具栏 */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: #fff;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toolbar-title {
      font-size: 16px;
      font-weight: 600;
    }

    .toolbar-badge {
      font-size: 11px;
      padding: 2px 8px;
      background: #e8f8ed;
      color: #30d158;
      border-radius: 100px;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.1);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: #f5f5f7;
    }

    /* 内容区 - 单页表单 */
    .content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    /* 表单卡片 - 紧凑布局 */
    .form-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .form-section {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .form-section:last-child {
      border-bottom: none;
    }

    .form-section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .form-section-header h3 {
      font-size: 13px;
      font-weight: 600;
      color: #6e6e73;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-section-header .step {
      width: 20px;
      height: 20px;
      background: #007aff;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
    }

    /* 表单行 - 水平布局 */
    .form-row {
      display: flex;
      gap: 16px;
      align-items: flex-end;
    }

    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.shrink {
      flex: 0 0 auto;
    }

    .form-label {
      font-size: 12px;
      font-weight: 500;
      color: #6e6e73;
    }

    .form-label .required {
      color: #ff3b30;
    }

    .form-input {
      height: 40px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.1);
      background: #f5f5f7;
      font-size: 13px;
      color: #1d1d1f;
      outline: none;
      transition: all 0.2s;
    }

    .form-input:focus {
      border-color: #007aff;
      box-shadow: 0 0 0 2px rgba(0,122,255,0.1);
    }

    .form-input::placeholder {
      color: #aeaeb2;
    }

    /* 分数区间 - 内联版 */
    .score-inline {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .score-input {
      width: 60px;
      height: 40px;
      text-align: center;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.1);
      background: #f5f5f7;
      font-size: 14px;
      font-weight: 600;
      color: #007aff;
    }

    .score-separator {
      color: #aeaeb2;
      font-size: 14px;
    }

    .score-hint {
      font-size: 11px;
      color: #aeaeb2;
      margin-left: 8px;
    }

    /* 上传区域 - 紧凑版 */
    .upload-compact {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .upload-compact:hover {
      border-color: #007aff;
      background: #f0f7ff;
    }

    .upload-compact.dragging {
      border-color: #007aff;
      border-style: solid;
      background: #eef5ff;
    }

    .upload-icon-compact {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #007aff;
      flex-shrink: 0;
    }

    .upload-info {
      flex: 1;
    }

    .upload-info .main-text {
      font-size: 13px;
      color: #1d1d1f;
      margin-bottom: 2px;
    }

    .upload-info .main-text strong {
      color: #007aff;
    }

    .upload-info .sub-text {
      font-size: 11px;
      color: #aeaeb2;
    }

    .upload-btn {
      height: 32px;
      padding: 0 12px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 底部操作栏 - 固定 */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: #fff;
      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .file-count {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #6e6e73;
    }

    .file-count .count {
      font-weight: 600;
      color: #007aff;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-primary {
      height: 40px;
      padding: 0 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      background: #007aff;
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      background: #0066d6;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      height: 40px;
      padding: 0 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      background: #f5f5f7;
      color: #1d1d1f;
      border: none;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: #e8e8ed;
    }

    /* 任务列表 - 紧凑版 */
    .task-list {
      margin-top: 20px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      background: #fff;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.06);
      margin-bottom: 8px;
    }

    .task-id {
      font-size: 13px;
      font-weight: 600;
      color: #1d1d1f;
      width: 60px;
    }

    .task-status {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 100px;
      background: #fff3e0;
      color: #ff9500;
    }

    .task-progress {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-progress-bar {
      flex: 1;
      height: 4px;
      background: #e5e5ea;
      border-radius: 2px;
      overflow: hidden;
    }

    .task-progress-fill {
      height: 100%;
      background: #007aff;
      border-radius: 2px;
    }

    .task-progress-text {
      font-size: 12px;
      color: #aeaeb2;
      width: 80px;
    }

    .task-time {
      font-size: 12px;
      color: #aeaeb2;
      width: 120px;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .task-action {
      font-size: 12px;
      color: #007aff;
      background: none;
      border: none;
      cursor: pointer;
    }

    .task-action:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>
          <span class="icon">📚</span>
          智能教学平台
        </h1>
      </div>
      <nav>
        <div class="nav-item">首页总览</div>
        <div class="nav-item">教学班管理 <span class="arrow">›</span></div>
        <div class="nav-item">实验教学 <span class="arrow">›</span></div>
        <div class="nav-item active">AI 批改 <span class="arrow">›</span></div>
        <div class="nav-item nav-sub active">批改中心</div>
        <div class="nav-item nav-sub">评分标准</div>
        <div class="nav-item">课程知识库 <span class="arrow">›</span></div>
        <div class="nav-item">AI 助教 <span class="arrow">›</span></div>
        <div class="nav-item">教辅工具 <span class="arrow">›</span></div>
      </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 顶部工具栏 -->
      <div class="toolbar">
        <div class="toolbar-left">
          <span class="toolbar-title">AI 批改中心</span>
          <span class="toolbar-badge">2 个任务进行中</span>
        </div>
        <div class="toolbar-right">
          <button class="btn-icon" title="刷新">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6M1 20v-6h6"/>
              <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
            </svg>
          </button>
          <button class="btn-icon" title="帮助">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 内容区 -->
      <div class="content">
        <!-- 创建表单 -->
        <div class="form-card">
          <!-- 步骤1：基本配置 -->
          <div class="form-section">
            <div class="form-section-header">
              <span class="step">1</span>
              <h3>基本配置</h3>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">
                  <span class="required">*</span> 评分标准
                </label>
                <select class="form-input">
                  <option value="" disabled selected>选择评分标准</option>
                  <option>数据结构实验综合评分标准</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">
                  <span class="required">*</span> 教师署名
                </label>
                <input type="text" class="form-input" placeholder="例如：张老师">
              </div>
              <div class="form-group shrink">
                <label class="form-label">实验ID</label>
                <input type="text" class="form-input" placeholder="可选" style="width: 100px;">
              </div>
              <div class="form-group shrink">
                <label class="form-label">班级ID</label>
                <input type="text" class="form-input" placeholder="可选" style="width: 100px;">
              </div>
            </div>
          </div>

          <!-- 步骤2：分数区间 -->
          <div class="form-section">
            <div class="form-section-header">
              <span class="step">2</span>
              <h3>分数期望</h3>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">
                  <span class="required">*</span> 期望分数区间
                </label>
                <div class="score-inline">
                  <input type="number" class="score-input" value="75" min="0" max="100">
                  <span class="score-separator">—</span>
                  <input type="number" class="score-input" value="99" min="0" max="100">
                  <span class="score-separator">分</span>
                  <span class="score-hint">AI 将参考此区间标记异常成绩</span>
                </div>
              </div>
            </div>
          </div>

          <!-- 步骤3：上传文件 -->
          <div class="form-section">
            <div class="form-section-header">
              <span class="step">3</span>
              <h3>上传作业</h3>
            </div>
            <div class="upload-compact" id="uploadZone">
              <div class="upload-icon-compact">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                </svg>
              </div>
              <div class="upload-info">
                <div class="main-text">
                  拖拽文件到此处，或 <strong>点击选择文件</strong>
                </div>
                <div class="sub-text">
                  支持 PDF、DOC、DOCX · 单文件最大 50MB · 最多 200 份
                </div>
              </div>
              <button class="upload-btn">选择文件</button>
            </div>
          </div>
        </div>

        <!-- 任务列表 -->
        <div class="task-list">
          <div class="task-item">
            <span class="task-id">#1234</span>
            <span class="task-status">处理中</span>
            <div class="task-progress">
              <div class="task-progress-bar">
                <div class="task-progress-fill" style="width: 65%;"></div>
              </div>
              <span class="task-progress-text">13/20 完成</span>
            </div>
            <span class="task-time">14:30 创建</span>
            <div class="task-actions">
              <button class="task-action">详情</button>
            </div>
          </div>
          <div class="task-item">
            <span class="task-id">#1233</span>
            <span class="task-status" style="background: #e8f8ed; color: #30d158;">已完成</span>
            <div class="task-progress">
              <div class="task-progress-bar">
                <div class="task-progress-fill" style="width: 100%; background: #30d158;"></div>
              </div>
              <span class="task-progress-text">20/20 完成</span>
            </div>
            <span class="task-time">10:15 创建</span>
            <div class="task-actions">
              <button class="task-action">详情</button>
              <button class="task-action">导出</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 底部操作栏 - 固定 -->
      <div class="footer">
        <div class="footer-left">
          <div class="file-count">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
              <polyline points="14,2 14,8 20,8"/>
            </svg>
            已选择 <span class="count">0</span> 个文件
          </div>
        </div>
        <div class="footer-right">
          <button class="btn-secondary">管理评分标准</button>
          <button class="btn-primary" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
            开始批改
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    // 上传区域拖拽交互演示
    const uploadZone = document.getElementById('uploadZone');

    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragging');
    });

    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('dragging');
    });

    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragging');
      alert('检测到文件拖入！');
    });
  </script>
</body>
</html>
